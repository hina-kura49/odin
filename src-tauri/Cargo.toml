[package]
name = "odin-app"
version = "0.1.0"
description = "Odin のデスクトップアプリ(Tauri 2)。いまはフロントエンドを MockBackend のまま動かす殻で、core/ にはまだつないでいない"
edition = "2021"
publish = false

[lib]
name = "odin_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
